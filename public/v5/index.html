<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191b1e">
  <title>Alexandru Oprea — V5</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/crossword.css">
  <link rel="stylesheet" href="/v3.css">
  <script type="module" src="/v3.js"></script>
</head>
<body class="v3-page v5-page">
  <details class="crossword-settings v3-settings">
    <summary>Settings</summary>
    <div data-settings-navigation></div>
    <script type="module" src="/settings-navigation.js"></script>
    <input id="chalk-grain" type="hidden" value="35">
  </details>
  <main class="v3-stage">
    <div class="v3-identity">
      <h1 class="v3-name"><button type="button" aria-label="Alexandru Oprea"><span class="v3-name-row"><span class="v3-letter"><span>A</span></span><span class="v3-rest"><span><span class="v3-letter"><span>l</span></span><span class="v3-letter"><span>e</span></span><span class="v3-letter"><span>x</span></span><span class="v3-letter"><span>a</span></span><span class="v3-letter"><span>n</span></span><span class="v3-letter"><span>d</span></span><span class="v3-letter"><span>r</span></span><span class="v3-letter"><span>u</span></span></span></span></span><span class="v3-name-row"><span class="v3-letter"><span>O</span></span><span class="v3-rest"><span><span class="v3-letter"><span>p</span></span><span class="v3-letter"><span>r</span></span><span class="v3-letter"><span>e</span></span><span class="v3-letter"><span>a</span></span></span></span></span></button></h1>
      <nav class="v3-nav" aria-label="Site menu">
      <button type="button" data-section="work" aria-label="Work" aria-haspopup="dialog" aria-controls="v3-work" style="--word-color:#b784cf"><span aria-hidden="true">+</span><span class="v3-word">Work</span><canvas aria-hidden="true"></canvas></button>
      <button type="button" data-section="cv" aria-label="CV" aria-haspopup="dialog" aria-controls="v3-cv" style="--word-color:#96b77e"><span aria-hidden="true">+</span><span class="v3-word">CV</span><canvas aria-hidden="true"></canvas></button>
      <button type="button" data-section="about" aria-label="About" aria-haspopup="dialog" aria-controls="v3-about" style="--word-color:#d9a781"><span aria-hidden="true">+</span><span class="v3-word">About</span><canvas aria-hidden="true"></canvas></button>
      <button type="button" data-section="contact" aria-label="Contact" aria-haspopup="dialog" aria-controls="v3-contact" style="--word-color:#6aa9cc"><span aria-hidden="true">+</span><span class="v3-word">Contact</span><canvas aria-hidden="true"></canvas></button>
      </nav>
    </div>
  </main>
  <dialog class="crossword-panel" id="v3-work" aria-labelledby="v3-work-title"><h2 id="v3-work-title">Work</h2><p>A selection of my product design projects will appear here.</p><form method="dialog"><button type="submit">Back to the board</button></form></dialog>
  <dialog class="crossword-panel" id="v3-cv" aria-labelledby="v3-cv-title"><h2 id="v3-cv-title">CV</h2><p>Product designer. MSc in Product Management &amp; UX Design.</p><form method="dialog"><button type="submit">Back to the board</button></form></dialog>
  <dialog class="crossword-panel" id="v3-about" aria-labelledby="v3-about-title"><h2 id="v3-about-title">About</h2><p>I design fintech products that earn trust through clarity and restraint.</p><form method="dialog"><button type="submit">Back to the board</button></form></dialog>
  <dialog class="crossword-panel" id="v3-contact" aria-labelledby="v3-contact-title"><h2 id="v3-contact-title">Contact</h2><p>designwithalexandru@gmail.com</p><form method="dialog"><button type="submit">Back to the board</button></form></dialog>
</body>
</html>
